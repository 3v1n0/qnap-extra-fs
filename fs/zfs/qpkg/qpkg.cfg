# Name of the packaged application.
QPKG_NAME="QNAP_ZFS"
# Display name shown on QTS Web UI (defaults to QPKG_NAME if not set).
QPKG_DISPLAY_NAME="ZFS filesystem support"
# Version of the packaged application.
QPKG_VER="1.0.0"
# Author or maintainer of the package
QPKG_AUTHOR="Marco Trevisan"
# License for the packaged application
QPKG_LICENSE="CDDL-1.0"
# One-line description of the packaged application
QPKG_SUMMARY="ZFS kernel modules and userspace tools for QTS"

# QTS's installer requires a service program: without one it runs
# "/etc/init.d/ start" and "/etc/init.d/ stop", which fail because
# /etc/init.d/ is a directory, and it builds the package's start and stop links
# from the name. The script named here does nothing on purpose: nothing in this
# package is started at boot, and the modules are loaded by load.sh.
QPKG_SERVICE_PROGRAM="extrafs-service.sh"

# Ordering for the start and stop links QTS builds from the service program.
QPKG_RC_NUM="100"

# Minimum QTS version requirement
QTS_MINI_VERSION="4.2.0"

# Install into the default volume without prompting.
QPKG_VOLUME_SELECT="0"
